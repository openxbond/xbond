"$schema" = "schemas/schema.json"

[default]
description = """Full access to the XBond mobile native capabilities the bundled UI needs: the LocalAPI endpoint it drives the tunnel through, the per-app VPN picker data, self-hosted update checks, UI preferences, system bar theming, OAuth callback delivery, the interactive VPN consent flow, and text export (save/share)."""
permissions = [
  "allow-get-localapi-config",
  "allow-startup-complete",
  "allow-list-installed-apps",
  "allow-get-split-tunnel-config",
  "allow-set-split-tunnel-config",
  "allow-check-for-updates",
  "allow-get-preference",
  "allow-set-preference",
  "allow-sync-system-bars",
  "allow-deliver-account-callback",
  "allow-request-vpn-consent",
  "allow-save-text-file",
  "allow-share-text-file",
  "allow-perform-haptic",
  "allow-get-notification-permission-state",
  "allow-request-notification-permission",
  "allow-open-notification-settings",
]
