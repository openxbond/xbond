# Unified xbond daemon in port mode (docs/specs/docker-daemon.md).
# Start with docker compose up -d. For local builds set XBOND_IMAGE_TAG=local.
#
# The management port (19090) serves the web UI with the per-boot access
# token embedded — publish it to trusted interfaces only.

services:
  xbond:
    image: ghcr.io/openxbond/xbond:${XBOND_IMAGE_TAG:-latest}
    container_name: xbond
    restart: unless-stopped
    ports:
      # Mixed proxy inbound — restrict to trusted interfaces if needed.
      - "7890:7890"
      # Management + web UI — accessible from the host and LAN; do not expose to WAN.
      - "19090:19090"
    volumes:
      - xbond-data:/data
    environment:
      SUB_URL: ${SUB_URL:-}
      # Optional management UI / LocalAPI secret (recommended when reachable from LAN).
      XBOND_SECRET: ${XBOND_SECRET:-}

volumes:
  xbond-data:
    name: xbond-data
