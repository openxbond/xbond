name: XBond
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
targets:
  XBond:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements]
      - Shared
      - path: ../../../dist
        type: folder
        buildPhase: resources
    dependencies:
      - framework: XBondMobile.xcframework
        embed: false
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.xbond.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(XBOND_APP_PROFILE)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: XBond
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XBondAppStoreURL: $(XBOND_APP_STORE_URL)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        UISupportedInterfaceOrientations~ipad:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          [packet-tunnel-provider]
        com.apple.security.application-groups: [group.net.xbond.app]
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: [Info.plist, PacketTunnel.entitlements]
      - Shared
    dependencies:
      - framework: XBondMobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.xbond.app.PacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(XBOND_TUNNEL_PROFILE)
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: XBond Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          [packet-tunnel-provider]
        com.apple.security.application-groups: [group.net.xbond.app]
schemes:
  XBond:
    build:
      targets:
        XBond: all
    archive:
      config: Release
