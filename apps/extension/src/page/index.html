<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XBond — manage</title>
    <style>
      body {
        font:
          13px/1.6 system-ui,
          sans-serif;
        margin: 0 auto;
        max-width: 760px;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 15px;
        margin-top: 24px;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
      }
      label.row span {
        min-width: 180px;
      }
      select {
        flex: 1;
        padding: 4px 6px;
      }
      button {
        padding: 5px 10px;
      }
      #state {
        padding: 8px;
        border-radius: 6px;
        background: #f2f2f2;
      }
      .bad {
        background: #fdecec;
      }
      .ok {
        background: #e6f6e9;
      }
      .node {
        padding: 3px 0;
        border-bottom: 1px solid #eee;
      }
      #events {
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        background: #fafafa;
        border: 1px solid #e5e5e5;
        padding: 8px;
        max-height: 240px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>XBond browser proxy</h1>
    <div id="state">loading…</div>
    <label><input type="checkbox" id="enabled" /> proxy on</label>
    <label class="row"
      ><span>mode</span>
      <select id="mode">
        <option value="rule">rule</option>
        <option value="global">global</option>
        <option value="direct">direct</option>
      </select>
    </label>

    <h2>Account</h2>
    <div id="account">
      <button id="sign-in" type="button">sign in</button>
      <button id="cancel-login" type="button" hidden>cancel</button>
      <button id="sign-out" type="button" hidden>sign out</button>
      <button id="refresh-config" type="button" hidden>refresh config</button>
      <div id="login-info" hidden>
        <p id="user-code"></p>
        <a id="verification-link" href="#" target="_blank" rel="noreferrer"
          >open verification page</a
        >
      </div>
    </div>

    <h2>Strategy groups</h2>
    <div id="groups"></div>

    <h2>Nodes</h2>
    <div id="nodes"></div>
    <p id="quota"></p>

    <h2>Diagnostics</h2>
    <div id="events"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
