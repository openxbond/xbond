[package]
name = "xbond-client"
version = "0.3.0"
description = "XBond desktop client"
authors = ["openxbond <no-reply@xbond.net>"]
edition = "2021"
license = "MIT"

[lib]
name = "xbond_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Tray-local LocalAPI client: loopback plain HTTP only, no TLS stack.
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps the core's proxy-group order (config order) in tray menus.
serde_json = { version = "1.0", features = ["preserve_order"] }
