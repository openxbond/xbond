[package]
name = "xbond-client"
version = "0.3.0"
description = "XBond desktop client"
authors = ["openxbond <no-reply@xbond.net>"]
edition = "2021"
license = "MIT"

[lib]
name = "xbond_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
