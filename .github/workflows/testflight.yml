name: Submit XBond to TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared stable Tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-store-ios
  cancel-in-progress: false

jobs:
  ios:
    if: github.repository == 'openxbond/xbond' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 25
    environment: release-store-ios
    permissions:
      actions: read
      contents: write # Draft release assets require push access.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - id: candidate
        run: |
          node scripts/release/release-ci.ts preflight "$TAG" store
          gh release download "$TAG" --pattern release-evidence.json --pattern release.json
          node scripts/release/release-assets.ts verify "$TAG" . release-evidence
          node scripts/release/release-ci.ts verify-evidence "$TAG" release-evidence.json
      - name: Require the prepare artifacts
        env:
          RUN_ID: ${{ steps.candidate.outputs.run }}
        run: node scripts/release/release-ci.ts require-artifact "$RUN_ID" app-store-build
      - uses: actions/download-artifact@v8.0.2
        with:
          name: app-store-build
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: release/${{ inputs.tag }}/ios
      - name: Verify the staged IPA
        env:
          IOS_SHA256: ${{ steps.candidate.outputs.ios_sha256 }}
        run: |
          if [ -z "$IOS_SHA256" ]; then
            echo "::error::This release was prepared without an iOS archive (distribution credentials absent). Rebuild the tag with credentials before TestFlight."
            exit 1
          fi
          printf '%s  %s\n' "$IOS_SHA256" "release/$TAG/ios/xbond-ios-$TAG.ipa" | shasum -a 256 -c -
      - name: Upload the verified IPA to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5.9.0
        with:
          app-path: release/${{ inputs.tag }}/ios/xbond-ios-${{ inputs.tag }}.ipa
          app-type: ios
          backend: altool
          wait-for-processing: "false"
          issuer-id: ${{ vars.ASC_ISSUER_ID }}
          api-key-id: ${{ vars.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY }}
