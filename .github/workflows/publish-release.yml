name: Publish XBond release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared stable Tag
        required: true
        type: string
      install_verified:
        description: Confirm that the candidate can be installed on all supported platforms
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-xbond-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'openxbond/xbond' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release-production
    outputs:
      pages_digest: ${{ steps.candidate.outputs.pages_digest }}
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      INSTALL_VERIFIED: ${{ inputs.install_verified }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
      APP_STORE_URL: ${{ vars.APP_STORE_URL }}
      IOS_TESTFLIGHT_URL: ${{ vars.IOS_TESTFLIGHT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          install: "false"
      - id: candidate
        run: |
          set -euo pipefail
          if [ "$INSTALL_VERIFIED" != "true" ]; then
            echo "::error::Verify installation on all supported platforms before publishing."
            exit 1
          fi
          node scripts/release-ci.ts preflight "$TAG" publish
          gh release view "$TAG" --json isDraft,isPrerelease --jq 'if .isPrerelease then error("Prerelease cannot be promoted") else "draft=" + (.isDraft | tostring) end' >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --dir release/assets
          node scripts/release-ci.ts verify-evidence "$TAG" release/assets/release-evidence.json
          # The pages command appends pages_digest to GITHUB_OUTPUT.
          node scripts/release-assets.ts pages "$TAG" release/assets release/pages "$APP_STORE_URL" "$IOS_TESTFLIGHT_URL"
      - id: registry
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          node scripts/release-registry.ts check "$TAG" "$IMAGE_DIGEST"
      - name: Require the prepare artifacts
        if: steps.registry.outputs.present == 'false'
        env:
          RUN_ID: ${{ steps.candidate.outputs.run }}
        run: node scripts/release-ci.ts require-artifact "$RUN_ID" release-image
      - if: steps.registry.outputs.present == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-image
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: release/oci
      - if: steps.registry.outputs.present == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: node scripts/release-registry.ts push "$TAG" "$IMAGE_DIGEST" release/oci/xbond-image.tar
      - name: Verify anonymous GHCR access
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: node scripts/release-registry.ts verify-public "$TAG" "$IMAGE_DIGEST"
      - name: Publish GitHub Release
        if: steps.candidate.outputs.draft == 'true'
        run: gh release edit "$TAG" --draft=false --latest
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release/pages

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          install: "false"
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed pages and update feeds
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          TAG: ${{ inputs.tag }}
          EXPECTED_DIGEST: ${{ needs.publish.outputs.pages_digest }}
        run: node scripts/release-assets.ts pages-verify "$TAG" "$PAGES_URL" "$EXPECTED_DIGEST"
