name: Desktop Check

# The Rust/Tauri job is the slowest check, so it only runs when the native
# shell or the frontend assets it embeds actually change. Push and PR watch
# the same paths so the PR gate cannot approve what the push gate rejects.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/client-ui/**"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/client-ui/**"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: "Desktop (Tauri)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds the frontend dist at compile time, so
      # cargo check needs dist-desktop/ to exist and be current.
      - run: pnpm build:desktop

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt

      - uses: ./.github/actions/setup-tauri-deps

      - run: pnpm desktop:fmt:check
      - run: pnpm desktop:check
