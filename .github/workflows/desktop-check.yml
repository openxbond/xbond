name: Desktop Check

# The Rust/Tauri job is the slowest check, so it only runs when the native
# shell or the frontend assets it embeds actually change. Push and PR watch
# the same paths so the PR gate cannot approve what the push gate rejects.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "plugins/**"
      - "apps/dashboard/**"
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/client-ui/**"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "plugins/**"
      - "apps/dashboard/**"
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/client-ui/**"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: "Desktop (Tauri, ${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds the frontend dist at compile time;
      # the shared crate's base config points at dist/web, so cargo check
      # needs it to exist. Desktop assets ride the desktop config overlay
      # and are exercised by the release pipeline.
      - run: pnpm build

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt

      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-tauri-deps

      # The release workflow builds the same crate for the Android and iOS
      # targets. A desktop target always requires the desktop feature.
      - run: pnpm desktop:fmt:check
      - run: pnpm desktop:check
