name: Desktop Check

# The Rust/Tauri job is the slowest check, so it only runs when the native
# shell or the frontend assets it embeds actually change. Push and PR watch
# the same paths so the PR gate cannot approve what the push gate rejects.
on:
  push:
    branches: [main]
    paths: &desktop_paths
      - "src-tauri/**"
      - "plugins/**"
      - "apps/dashboard/**"
      - "apps/desktop/**"
      - "packages/client/**"
      - "packages/client-ui/**"
      - "vite.config.ts"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/actions/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    branches: [main]
    paths: *desktop_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: "Desktop (Tauri, ${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt

      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-tauri-deps

      # The release workflow builds the same crate for the Android and iOS
      # targets. A desktop target always requires the desktop feature.
      - run: pnpm check:desktop
