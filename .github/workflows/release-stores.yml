name: XBond store operations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared stable Tag
        required: true
        type: string
      store:
        description: Store
        type: choice
        options: [ios, chrome, edge]
        required: true
      operation:
        description: Submit build or check browser store status
        type: choice
        options: [status, submit]
        required: true
      edge_operation_id:
        description: Operation ID from the Edge submission when checking its status
        type: string

permissions:
  contents: read

concurrency:
  group: release-store-${{ inputs.store }}
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'openxbond/xbond' && github.ref == 'refs/heads/main' && inputs.store != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-store-${{ inputs.store }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      STORE: ${{ inputs.store }}
      OPERATION: ${{ inputs.operation }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          install: "false"
      - name: Verify staged store ZIP
        if: inputs.operation == 'submit'
        run: |
          node scripts/release-ci.ts preflight "$TAG" store
          gh release download "$TAG" --pattern "xbond-extension-$TAG.zip" --pattern release.json --pattern release-evidence.json
          node scripts/release-assets.ts verify "$TAG" . extension
          node scripts/release-assets.ts verify "$TAG" . release-evidence
          node scripts/release-ci.ts verify-evidence "$TAG" release-evidence.json
      - name: Submit or inspect the store build
        env:
          CHROME_SERVICE_ACCOUNT: ${{ secrets.CHROME_SERVICE_ACCOUNT }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_OPERATION_ID: ${{ inputs.edge_operation_id }}
        run: node scripts/release-store.ts "$STORE" "$OPERATION" "$TAG" "xbond-extension-$TAG.zip"

  ios:
    if: github.repository == 'openxbond/xbond' && github.ref == 'refs/heads/main' && inputs.store == 'ios'
    runs-on: macos-26
    timeout-minutes: 25
    environment: release-store-ios
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - name: Reject unsupported operations
        if: inputs.operation != 'submit'
        run: |
          echo "::error::The iOS store supports operation=submit only. Browser stores also support operation=status."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          install: "false"
      - id: candidate
        run: |
          node scripts/release-ci.ts preflight "$TAG" store
          gh release download "$TAG" --pattern release-evidence.json --pattern release.json
          node scripts/release-assets.ts verify "$TAG" . release-evidence
          node scripts/release-ci.ts verify-evidence "$TAG" release-evidence.json
      - name: Require the prepare artifacts
        env:
          RUN_ID: ${{ steps.candidate.outputs.run }}
        run: node scripts/release-ci.ts require-artifact "$RUN_ID" app-store-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-store-build
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: release/ios
      - name: Verify the staged IPA
        env:
          IOS_SHA256: ${{ steps.candidate.outputs.ios_sha256 }}
        run: |
          printf '%s  %s\n' "$IOS_SHA256" release/ios/xbond.ipa | shasum -a 256 -c -
      - name: Upload the verified IPA to TestFlight
        uses: Apple-Actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5
        with:
          app-path: release/ios/xbond.ipa
          app-type: ios
          backend: altool
          wait-for-processing: "false"
          issuer-id: ${{ vars.ASC_ISSUER_ID }}
          api-key-id: ${{ vars.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY }}
