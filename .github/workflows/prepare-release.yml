name: Prepare XBond release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Tag or proposed Tag for a rehearsal from main
        required: true
        type: string
      rehearsal:
        description: Build and validate without writing a Release or submitting to stores
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'openxbond/xbond' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal && 'rehearsal' || 'prepare' }}
        run: node scripts/release-ci.ts preflight "$TAG" "$RELEASE_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md

  core:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          go: "true"
      - run: pnpm check
      - run: pnpm cli:check
      - run: |
          test -n "$XBOND_RELEASE_PUBLIC_KEY"
          node scripts/build-release.ts "$TAG"
          "./release/$TAG/xbond-$TAG-linux-amd64" version --json | jq -e --arg v "$XBOND_VERSION" '.clientVersion == $v and .os == "linux" and .arch == "amd64"'
      - run: pnpm ext:build
      - run: node scripts/release-assets.ts extension "$TAG" apps/extension/dist "release/$TAG/xbond-extension-$TAG.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-assets
          path: |
            release/${{ needs.preflight.outputs.tag }}/xbond-*
            release/${{ needs.preflight.outputs.tag }}/dashboard.zip
          compression-level: 0
          if-no-files-found: error

  desktop:
    needs: [preflight, core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-assets
          path: release/core
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2
      - name: Import Windows code signing certificate when configured
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX) { exit 0 }
          $certificatePath = Join-Path $env:RUNNER_TEMP "xbond-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_PFX))
            $password = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificate = @($certificates | Where-Object HasPrivateKey)
            if ($certificate.Count -ne 1) { throw "Expected one code signing certificate" }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item -LiteralPath $certificatePath -ErrorAction SilentlyContinue
          }
      - name: Build and sign desktop installer
        shell: bash
        env:
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
          XBOND_DESKTOP_REHEARSAL: ${{ runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.rehearsal && vars.APPLE_SIGNING_IDENTITY == '' && '1' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: node scripts/build-desktop-release.ts "$TAG" "$TARGET_OS" "$TARGET_ARCH" release/core release/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: release/desktop/*
          compression-level: 0
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-android-signing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          go: "true"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
      - name: Build unsigned APK
        run: |
          test -n "$XBOND_RELEASE_PUBLIC_KEY"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          go install golang.org/x/mobile/cmd/gomobile@"$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          pnpm build
          pnpm mobile:bind:android
          gradle -p apps/mobile/android :app:assembleRelease
      - name: Sign and verify APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          tmp=$(mktemp -d)
          trap 'rm -f "$tmp/keystore" "$tmp/aligned.apk"; rmdir "$tmp"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$tmp/keystore"
          mkdir -p release/android
          apk="release/android/xbond-android-$TAG.apk"
          "$tools/zipalign" -P 16 -f 4 apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/aligned.apk"
          "$tools/apksigner" sign --ks "$tmp/keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$apk" "$tmp/aligned.apk"
          "$tools/apksigner" verify --print-certs "$apk" | grep -Fx "Signer #1 certificate SHA-256 digest: $ANDROID_SIGNER_SHA256"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='net.xbond.app' versionCode='$XBOND_BUILD_NUMBER' versionName='$XBOND_VERSION'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: release/android/*.apk
          compression-level: 0
          if-no-files-found: error

  ios:
    needs: preflight
    # Only rehearsals may omit the App Store archive.
    if: github.event_name == 'push' || !inputs.rehearsal || vars.APPLE_TEAM_ID != ''
    runs-on: macos-15
    timeout-minutes: 65
    environment: release-ios-signing
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/release-toolchain
        with:
          go: "true"
      - name: Build Web and Go framework
        run: |
          brew install xcodegen
          go install golang.org/x/mobile/cmd/gomobile@"$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          export PATH="$(go env GOPATH)/bin:$PATH"
          pnpm build
          pnpm mobile:bind:ios
      - name: Archive signed App Store build
        id: archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          XBOND_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_TUNNEL_PROFILE: ${{ secrets.IOS_TUNNEL_PROFILE }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          keychain="$tmp/xbond.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf -- "$tmp"' EXIT
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 -D > "$tmp/cert.p12"
          security import "$tmp/cert.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          install_profile() {
            local profile="$tmp/$1.mobileprovision"
            local uuid
            base64 -D > "$profile"
            security cms -D -i "$profile" > "$tmp/$1.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$tmp/$1.plist")
            for profile_dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$profile_dir"
              cp "$profile" "$profile_dir/$uuid.mobileprovision"
            done
            printf '%s' "$uuid"
          }
          APPLE_APP_PROFILE=$(printf '%s' "$IOS_APP_PROFILE" | install_profile app)
          APPLE_TUNNEL_PROFILE=$(printf '%s' "$IOS_TUNNEL_PROFILE" | install_profile tunnel)
          export APPLE_APP_PROFILE APPLE_TUNNEL_PROFILE
          bash apps/mobile/ios/build-release.sh release/ios
          echo "sha256=$(shasum -a 256 release/ios/xbond.ipa | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-build
          path: release/ios/xbond.ipa
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  image:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "XBOND_VERSION=$XBOND_VERSION" --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.revision=$COMMIT" --label "org.opencontainers.image.source=https://github.com/openxbond/xbond" \
            --provenance=false --output "type=oci,dest=xbond-image.tar" --metadata-file image.json .
          jq -er '"digest=" + ."containerimage.digest"' image.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image
          path: xbond-image.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  assemble:
    needs: [preflight, core, desktop, android, image, ios]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' && needs.core.result == 'success' &&
      needs.desktop.result == 'success' && needs.android.result == 'success' &&
      needs.image.result == 'success' && (needs.ios.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.rehearsal && needs.ios.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-manifest-signing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "{core-assets,desktop-*,android}"
          merge-multiple: true
          path: release/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
      - name: Assemble and verify signed release
        env:
          XBOND_RELEASE_PRIVATE_KEY: ${{ secrets.XBOND_RELEASE_PRIVATE_KEY }}
          XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IOS_SHA256: ${{ needs.ios.outputs.sha256 }}
          PARTIAL_IOS_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearsal && needs.ios.result == 'skipped' && '1' || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/release-ci.ts evidence "$TAG" release/assets
          node scripts/release-assets.ts assemble "$TAG" release/assets release-notes.md
          node scripts/release-assets.ts pages "$TAG" release/assets release/pages https://apps.apple.com/ https://chromewebstore.google.com/ https://microsoftedge.microsoft.com/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: release/assets/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' || !inputs.rehearsal
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    environment: release-draft
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
      - run: bash scripts/stage-release.sh "$TAG"
