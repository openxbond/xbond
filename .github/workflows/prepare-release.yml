name: Prepare XBond release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Tag or proposed Tag for a rehearsal from main
        required: true
        type: string
      mode:
        description: Build a rehearsal, a signed Apple rehearsal, or a release candidate
        type: choice
        options: [rehearsal, rehearsal-with-apple, release]
        default: rehearsal

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'openxbond/xbond' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      mode: ${{ steps.version.outputs.mode }}
      apple_signing: ${{ steps.version.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
          XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: node scripts/release/release-ci.ts preflight "$TAG" prepare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  check:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.preflight.outputs.commit }}

  core:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
      - run: pnpm release:core "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-assets
          path: |
            release/${{ needs.preflight.outputs.tag }}/core/xbond-*
            release/${{ needs.preflight.outputs.tag }}/core/dashboard.zip
          compression-level: 0
          if-no-files-found: error

  desktop:
    needs: [preflight, check, core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: "true"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-assets
          path: release/${{ needs.preflight.outputs.tag }}/core
      - run: pnpm setup:desktop ${{ runner.os == 'Linux' && '--appimage' || '' }}
      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./scripts/release/windows-cert.ps1
      - name: Build and sign desktop installer
        shell: bash
        env:
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && vars.APPLE_SIGNING_IDENTITY || '' }}
          ASC_KEY: ${{ runner.os == 'macOS' && secrets.ASC_KEY || '' }}
          ASC_KEY_ID: ${{ runner.os == 'macOS' && vars.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ runner.os == 'macOS' && vars.ASC_ISSUER_ID || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm release:desktop "$TAG" "$TARGET_OS" "$TARGET_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: release/${{ needs.preflight.outputs.tag }}/desktop/${{ matrix.os }}-${{ matrix.arch }}/*
          compression-level: 0
          if-no-files-found: error

  android:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-android-signing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
      # Tag runs can only restore caches saved in the default branch scope, so
      # the warm entries come from rehearsal runs dispatched from main; the
      # first build after a fresh tag without a rehearsal stays cold.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: "true"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ""
      - run: pnpm setup:android
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and sign the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD_OVERRIDE }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: pnpm release:android "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android
          path: release/${{ needs.preflight.outputs.tag }}/android/*.apk
          compression-level: 0
          if-no-files-found: error

  ios:
    needs: [preflight, check]
    # A release skips the archive only when iOS credentials are absent;
    # configured-but-broken credentials must fail the run loudly.
    if: needs.preflight.outputs.mode == 'release' || needs.preflight.outputs.apple_signing == 'true'
    runs-on: macos-26
    timeout-minutes: 65
    environment: release-ios-signing
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
      skipped: ${{ steps.probe.outputs.skipped }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Probe the iOS signing environment
        id: probe
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          TUNNEL_PROFILE: ${{ secrets.IOS_TUNNEL_PROFILE }}
        run: |
          if [ -n "$P12" ] && [ -n "$PASSWORD" ] && [ -n "$APP_PROFILE" ] && [ -n "$TUNNEL_PROFILE" ]; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS distribution credentials are not configured; skipping the App Store archive."
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.probe.outputs.skipped == 'false'
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        if: steps.probe.outputs.skipped == 'false'
        with:
          go: "true"
      - uses: Swatinem/rust-cache@v2.9.3
        if: steps.probe.outputs.skipped == 'false'
        with:
          workspaces: src-tauri
          cache-on-failure: "true"
      - if: steps.probe.outputs.skipped == 'false'
        run: pnpm setup:ios
      - name: Archive the signed App Store build
        id: archive
        if: steps.probe.outputs.skipped == 'false'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          XBOND_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_TUNNEL_PROFILE: ${{ secrets.IOS_TUNNEL_PROFILE }}
        run: pnpm release:ios "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.probe.outputs.skipped == 'false'
        with:
          name: app-store-build
          path: release/${{ needs.preflight.outputs.tag }}/ios/xbond-ios-${{ needs.preflight.outputs.tag }}.ipa
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  image:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - id: image
        run: pnpm release:image "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-image
          path: release/${{ needs.preflight.outputs.tag }}/oci/xbond-oci-${{ needs.preflight.outputs.tag }}.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  assemble:
    needs: [preflight, core, desktop, android, ios, image]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
      needs.core.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' &&
      needs.image.result == 'success' &&
      (needs.ios.result == 'success' ||
      (needs.preflight.outputs.mode == 'rehearsal' &&
      needs.preflight.outputs.apple_signing == 'false' && needs.ios.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-manifest-signing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_MODE: ${{ needs.preflight.outputs.mode }}
      RELEASE_APPLE_SIGNING: ${{ needs.preflight.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "{core-assets,desktop-*,android}"
          merge-multiple: true
          path: release/${{ needs.preflight.outputs.tag }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - run: pnpm setup:release
      - name: Assemble and verify signed release
        env:
          XBOND_RELEASE_PRIVATE_KEY: ${{ secrets.XBOND_RELEASE_PRIVATE_KEY }}
          XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IOS_SHA256: ${{ needs.ios.outputs.sha256 }}
        run: pnpm release:assemble "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: release/${{ needs.preflight.outputs.tag }}/assets/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  draft:
    if: needs.preflight.outputs.mode == 'release'
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-draft
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-release
          path: release/${{ needs.preflight.outputs.tag }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - run: bash scripts/release/stage-release.sh "$TAG"
