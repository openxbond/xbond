name: Prepare XBond release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Tag or proposed Tag for a rehearsal from main
        required: true
        type: string
      mode:
        description: Build a rehearsal, a signed Apple rehearsal, or a release candidate
        type: choice
        options: [rehearsal, rehearsal-with-apple, release]
        default: rehearsal

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'openxbond/xbond' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.version.outputs.commit }}
      mode: ${{ steps.version.outputs.mode }}
      apple_signing: ${{ steps.version.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_MODE: ${{ inputs.mode }}
          XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: node scripts/release/release-ci.ts preflight "$TAG" prepare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  check:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.preflight.outputs.commit }}

  core:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
      - run: |
          test -n "$XBOND_RELEASE_PUBLIC_KEY"
          pnpm release:core "$TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: core-assets
          path: |
            release/${{ needs.preflight.outputs.tag }}/core/xbond-*
            release/${{ needs.preflight.outputs.tag }}/core/dashboard.zip
          compression-level: 0
          if-no-files-found: error

  desktop:
    needs: [preflight, check, core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_APPLE_SIGNING: ${{ needs.preflight.outputs.apple_signing }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@v8.0.2
        with:
          name: core-assets
          path: release/${{ needs.preflight.outputs.tag }}/core
      - uses: ./.github/actions/setup-tauri-deps
        if: runner.os == 'Linux'
        with:
          fuse2: "true"
      - name: Import Windows code signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./scripts/release/windows-cert.ps1
      - name: Build and sign desktop installer
        shell: bash
        env:
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && vars.APPLE_SIGNING_IDENTITY || '' }}
          ASC_KEY: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && secrets.ASC_KEY || '' }}
          ASC_KEY_ID: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && vars.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && vars.ASC_ISSUER_ID || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'true' && vars.APPLE_TEAM_ID || '' }}
          XBOND_DESKTOP_REHEARSAL: ${{ runner.os == 'macOS' && env.RELEASE_APPLE_SIGNING == 'false' && '1' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          pnpm release:desktop "$TAG" "$TARGET_OS" "$TARGET_ARCH"
      - name: Verify Windows installer Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "release/$($env:TAG)/desktop/windows-$($env:TARGET_ARCH)/xbond-desktop-$($env:TAG)-windows-$($env:TARGET_ARCH).exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if (-not $env:WINDOWS_CERTIFICATE_THUMBPRINT -and $signature.Status -eq "NotSigned") {
            Write-Warning "Windows installer has no Authenticode signature: $installer"
            return
          }
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw "Invalid Authenticode signature for ${installer}: $($signature.Status) ($($signature.StatusMessage))"
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: release/${{ needs.preflight.outputs.tag }}/desktop/${{ matrix.os }}-${{ matrix.arch }}/*
          compression-level: 0
          if-no-files-found: error

  android:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-android-signing
    env:
      NDK_VERSION: "28.2.13676358"
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
      XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}"
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and sign the release APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD_OVERRIDE || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          test -n "$XBOND_RELEASE_PUBLIC_KEY"
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_HOME="$NDK_HOME"
          pnpm android:bind
          pnpm tauri android build --apk
          node scripts/release/release-android.ts sign "$TAG" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            "release/$TAG/android"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android
          path: release/${{ needs.preflight.outputs.tag }}/android/xbond-android-${{ needs.preflight.outputs.tag }}.apk
          compression-level: 0
          if-no-files-found: error

  ios:
    needs: [preflight, check]
    # Only rehearsals without Apple credentials may omit the App Store archive.
    if: needs.preflight.outputs.apple_signing == 'true'
    runs-on: macos-26
    timeout-minutes: 65
    environment: release-ios-signing
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      XBOND_BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
      - name: Build the Go framework
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios
          pnpm ios:bind
      - name: Archive the signed App Store build
        id: archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          XBOND_APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_APP_PROFILE: ${{ secrets.IOS_APP_PROFILE }}
          IOS_TUNNEL_PROFILE: ${{ secrets.IOS_TUNNEL_PROFILE }}
        run: |
          bash scripts/release/release-ios.sh archive "release/$TAG/ios"
          ipa_sha256="$(shasum -a 256 "release/$TAG/ios/xbond-ios-$TAG.ipa")"
          echo "sha256=${ipa_sha256%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: app-store-build
          path: release/${{ needs.preflight.outputs.tag }}/ios/xbond-ios-${{ needs.preflight.outputs.tag }}.ipa
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  image:
    needs: [preflight, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      XBOND_VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - id: image
        run: |
          set -euo pipefail
          mkdir -p "release/$TAG/oci"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "XBOND_VERSION=$XBOND_VERSION" --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.revision=$COMMIT" --label "org.opencontainers.image.source=https://github.com/openxbond/xbond" \
            --provenance=false --output "type=oci,dest=release/$TAG/oci/xbond-oci-$TAG.tar" --metadata-file "release/$TAG/oci/image.json" .
          jq -er '"digest=" + ."containerimage.digest"' "release/$TAG/oci/image.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-image
          path: release/${{ needs.preflight.outputs.tag }}/oci/xbond-oci-${{ needs.preflight.outputs.tag }}.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  assemble:
    needs: [preflight, core, desktop, android, ios, image]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
      needs.core.result == 'success' && needs.desktop.result == 'success' && needs.android.result == 'success' &&
      needs.image.result == 'success' &&
      (needs.ios.result == 'success' ||
      (needs.preflight.outputs.apple_signing == 'false' && needs.ios.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-manifest-signing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_MODE: ${{ needs.preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: "{core-assets,desktop-*,android}"
          merge-multiple: true
          path: release/${{ needs.preflight.outputs.tag }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - name: Assemble and verify signed release
        env:
          XBOND_RELEASE_PRIVATE_KEY: ${{ secrets.XBOND_RELEASE_PRIVATE_KEY }}
          XBOND_RELEASE_PUBLIC_KEY: ${{ vars.XBOND_RELEASE_PUBLIC_KEY }}
          XBOND_TAURI_PUBLIC_KEY: ${{ vars.XBOND_TAURI_PUBLIC_KEY }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          IOS_SHA256: ${{ needs.ios.outputs.sha256 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/release/release-ci.ts evidence "$TAG" "release/$TAG/assets"
          node scripts/release/release-assets.ts assemble "$TAG" "release/$TAG/assets" release-notes.md
          node scripts/release/release-assets.ts pages "$TAG" "release/$TAG/assets" "release/$TAG/pages"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-release
          path: release/${{ needs.preflight.outputs.tag }}/assets/*
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  draft:
    if: needs.preflight.outputs.mode == 'release'
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-draft
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-release
          path: release/${{ needs.preflight.outputs.tag }}/assets
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - run: bash scripts/release/stage-release.sh "$TAG"
