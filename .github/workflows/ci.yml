name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Check-only runs can replace earlier runs for the same event and ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to the commit SHAs the release workflows use; dependabot
# keeps the pins fresh. The commands mirror docs/agents/verification.md: this
# file only reuses what `pnpm` already provides locally.
jobs:
  web:
    name: "Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout otherwise leaves its token behind for later Git commands.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node >= 24: scripts/*.ts run on default type stripping (no
          # --experimental-strip-types), matching the engines floor.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm build
      # Empty output must fail even when the build command exits successfully.
      - name: Verify build output
        run: |
          if [[ -z "$(find dist/web -type f -print -quit)" ]]; then
            echo "::error::dist/web/ holds no files – the dashboard build is incomplete."
            exit 1
          fi

  go:
    name: "Go"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Same gates as locally: vet, test, build – all with the shared build
      # tags from scripts/go.ts. No pnpm install: cli:check only shells out to
      # the Go toolchain through scripts/go.ts.
      - run: pnpm cli:check
