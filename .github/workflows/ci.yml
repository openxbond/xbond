name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Source commit to check
        required: true
        type: string

# Check-only runs can replace earlier runs for the same event and ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.commit && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: "Policy"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          install: "false"
      # Keep the required Policy context green on push and reusable-workflow
      # runs; the pull_request payload is what carries the actual gate.
      - run: node scripts/check/check-git-policy.ts pr
      - name: Check commit identities
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node scripts/check/check-git-policy.ts commits "origin/$BASE_REF..HEAD"

  web:
    name: "Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: pnpm check:web

  go:
    name: "Go"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
          install: "false"
      - run: pnpm cli:check
      # Windows-tagged sources never compile under the Linux vet above; this
      # is what let the SDDL machine-install bug reach a release candidate.
      - name: Vet Windows sources
        env:
          GOOS: windows
        run: pnpm cli:vet
