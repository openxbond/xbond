name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Source commit to check
        required: true
        type: string

# Check-only runs can replace earlier runs for the same event and ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.commit && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: "Web"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - run: pnpm check
      - run: pnpm build
      - name: Verify dashboard entry
        run: test -s dist/web/index.html

  go:
    name: "Go"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          go: "true"
          install: "false"
      - run: pnpm cli:check
