name: Tauri system dependencies
description: Install the Linux libraries the Tauri WebKit build needs
inputs:
  fuse2:
    description: Also install libfuse2, needed to run the AppImage bundle
    default: "false"
runs:
  using: composite
  steps:
    - run: |
        sudo apt-get update
        packages=(libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev)
        if [[ "${{ inputs.fuse2 }}" == "true" ]]; then
          packages+=(libfuse2)
        fi
        sudo apt-get install -y "${packages[@]}"
      shell: bash
